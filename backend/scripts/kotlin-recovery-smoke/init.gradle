// Opt-in live safe-retry task; desktop build/source files remain unchanged.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def root = project.projectDir.parentFile
    def smokeSource = new File(root, 'backend/scripts/kotlin-recovery-smoke/RealRecoverySmoke.kt')
    def output = new File(root, 'backend/target/kotlin-recovery-smoke/classes')
    def main = project.extensions.getByType(org.gradle.api.tasks.SourceSetContainer).getByName('main')
    def compileSmoke = project.tasks.register('compileRealRecoverySmoke', JavaExec) {
        classpath = project.configurations.getByName('kotlinCompilerClasspath')
        mainClass.set('org.jetbrains.kotlin.cli.jvm.K2JVMCompiler')
        inputs.file(smokeSource)
        inputs.files(main.compileClasspath, main.output)
        outputs.dir(output)
        dependsOn(project.tasks.named('classes'))
        doFirst {
            args = ['-no-stdlib', '-no-reflect', '-jvm-target', '21',
                    '-classpath', main.runtimeClasspath.filter { it.exists() }.asPath, '-d', output.absolutePath, smokeSource.absolutePath]
        }
    }
    project.tasks.register('realRecoverySmoke', JavaExec) {
        group = 'verification'
        description = 'Opt-in real CIO safe retry: lost committed replies, pending intent and server revision conflict.'
        dependsOn(compileSmoke)
        classpath = project.files(output, main.runtimeClasspath)
        mainClass.set('dev.focusduo.smoke.recovery.RealRecoverySmokeKt')
        systemProperty('focusduo.smoke.baseUrl', System.getProperty('focusduo.smoke.baseUrl', 'http://127.0.0.1:8090'))
        timeout.set(java.time.Duration.ofMinutes(3))
    }
}
